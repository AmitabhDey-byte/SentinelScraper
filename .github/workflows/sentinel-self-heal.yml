name: SentinelScrape self-heal

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  scrape-heal-rerun:
    runs-on: ubuntu-latest
    env:
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash-lite
      DATABASE_URL: sqlite:///./backend/sentinelscrape.db
      AUTO_APPROVE_HEALS: "true"
    steps:
      - name: Check out SentinelScrape
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --global @brightdata/cli

      - name: Prepare database and collectors
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python scripts/bootstrap_collectors.py

      - name: Run, heal, approve, and re-run
        run: python scripts/ci_self_heal.py

      - name: Upload collector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelscrape-collector-evidence
          path: backend/output/
          if-no-files-found: ignore
